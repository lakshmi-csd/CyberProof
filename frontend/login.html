<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — CyberProof</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            CyberProof
        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="scanner.html">Scanner</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="incident.html">Incident Check</a>

            <a href="history.html">History</a>

            <a href="threats.html">Threat Pulse</a>

            <a href="learn.html">Learn</a>

            <a href="login.html" class="nav-button active">
                  Sign in
                 </a>

        </nav>

    </div>

</header>


<main>

<section class="section">

    <div class="container">

        <div style="
            max-width:520px;
            margin:20px auto 0;
            padding:42px;
            background:linear-gradient(
                145deg,
                rgba(15,29,60,0.95),
                rgba(7,14,31,0.98)
            );
            border:1px solid rgba(255,255,255,0.10);
            border-radius:28px;
            box-shadow:0 30px 80px rgba(0,0,0,0.35);
        ">

            <div style="text-align:center;">

                <span class="trust-pill">
                    SECURE ACCESS
                </span>

                <h1 style="
                    margin-top:20px;
                    font-size:48px;
                    line-height:1;
                    letter-spacing:-3px;
                    color:#ffffff;
                ">
                    Welcome back
                </h1>

                <p style="
                    margin-top:14px;
                    color:#93a0b8;
                ">
                    Sign in to access your CyberProof activity.
                </p>

            </div>


            <form id="loginForm" style="margin-top:32px;">

                <label style="
                    display:block;
                    font-size:13px;
                    font-weight:800;
                    margin-bottom:8px;
                    color:#cbd7e8;
                ">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                    style="
                        width:100%;
                        padding:16px;
                        border:1px solid rgba(255,255,255,0.10);
                        border-radius:15px;
                        outline:none;
                        background:rgba(3,8,20,0.72);
                        color:#ffffff;
                    "
                >


                <label style="
                    display:block;
                    font-size:13px;
                    font-weight:800;
                    margin-top:20px;
                    margin-bottom:8px;
                    color:#cbd7e8;
                ">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    style="
                        width:100%;
                        padding:16px;
                        border:1px solid rgba(255,255,255,0.10);
                        border-radius:15px;
                        outline:none;
                        background:rgba(3,8,20,0.72);
                        color:#ffffff;
                    "
                >


                <button
                    type="submit"
                    class="scan-button"
                >
                    Continue →
                </button>

            </form>


            <div
                id="loginMessage"
                style="
                    display:none;
                    margin-top:20px;
                    padding:15px;
                    border-radius:14px;
                    background:rgba(79,140,255,0.08);
                    border:1px solid rgba(79,140,255,0.20);
                    color:#b9d9ff;
                    text-align:center;
                "
            >
            </div>


            <p style="
                margin-top:25px;
                text-align:center;
                color:#71819d;
                font-size:13px;
            ">
                Your login session is securely stored for this browser.
            </p>

        </div>

    </div>

</section>

</main>


<footer class="footer">

    <div class="container footer-inner">

        <div>

            <strong>
                CyberProof
            </strong>

            <p style="margin-top:6px;">
                Evidence-based digital trust analysis.
            </p>

        </div>

        <p>
            Digital Trust Engine
        </p>

    </div>

</footer>


<script src="login.js"></script>
<script src="nav-active.js"></script>
</body>
</html>
